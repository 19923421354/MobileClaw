apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

android {
    namespace 'com.mobileclaw.app'
    compileSdk 34

    signingConfigs {
        // 签名配置：通过环境变量传入，避免硬编码密码
        // 未设置环境变量时使用 Android 默认 debug 签名
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: '/workspace/release.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'mobileclaw2024'
            keyAlias System.getenv('KEY_ALIAS') ?: 'mobileclaw'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'mobileclaw2024'
        }
    }

    defaultConfig {
        applicationId "com.mobileclaw.app"
        minSdk 29
        targetSdk 34
        versionCode 29
        versionName "2.0.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    // AndroidX core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Serialization for JSON
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.2'

    // OkHttp for AI API calls
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Shizuku SDK
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Swipe refresh
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}