name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare signing keystore
        run: |
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/release.keystore" \
            -alias mobileclaw -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mobileclaw2024 -keypass mobileclaw2024 \
            -dname "CN=MobileClaw, OU=MobileClaw, O=MobileClaw, C=CN"

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: mobileclaw2024
          KEY_ALIAS: mobileclaw
          KEY_PASSWORD: mobileclaw2024
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/MobileClaw-v5.0.0.apk \;
          ls -la out app/build/outputs/apk/release || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileClaw-apk
          path: out/*.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}